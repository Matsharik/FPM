# Единый словарь метрик «Фотопринт».
#
# Названия метрик взяты из ТЗ и слов заказчика. Все цели и пороги — синтетические
# (synthetic: true): они нужны для демо и подбираются заказчиком при внедрении.
# Денежных единиц здесь нет и быть не может, пока settings.allow_money = false (Р7).
#
# direction:    lower_better | higher_better
# priority:     time | quality | cost | other        (срок → качество → себестоимость)
# aggregation:  mean | sum | last                     (как точки за сутки сводятся в одно значение)
# display.relative: pct_of_target | index | share | as_is
# thresholds:   default — обычный профиль; season — в месяцы из settings.season_months

# --- Поддержка (по словарю Mary) --------------------------------------------

tickets_inbound:
  title: Входящих обращений за сутки
  definition: Число обращений клиентов во всех каналах за сутки
  formula: count(tickets created)
  source: support
  owner: Зам. по работе с клиентами
  unit: шт
  display: {relative: pct_of_target, natural: шт}
  direction: lower_better
  priority: other
  tile: support
  stage: 7
  aggregation: sum
  thresholds:
    default: {target: 1200, warn: 1600, crit: 2000}
    season: {target: 2000, warn: 2600, crit: 3200}
  synthetic: true

tickets_unanswered:
  title: Обращений без ответа сейчас
  definition: Число открытых обращений, на которые ещё не дан первый ответ
  formula: count(tickets without first reply)
  source: support
  owner: Зам. по работе с клиентами
  unit: шт
  display: {relative: pct_of_target, natural: шт}
  direction: lower_better
  priority: time
  tile: support
  stage: 7
  aggregation: last
  thresholds:
    default: {target: 10, warn: 30, crit: 60}
    season: {target: 20, warn: 50, crit: 90}
  synthetic: true

reply_1min_share:
  title: Доля ответов за 1 минуту
  definition: Доля обращений, первый ответ на которые дан в течение минуты
  formula: replied_within_1min / tickets
  source: support
  owner: Зам. по работе с клиентами
  unit: "%"
  display: {relative: pct_of_target, natural: "%"}
  direction: higher_better
  priority: time
  tile: support
  stage: 7
  aggregation: mean
  thresholds:
    default: {target: 80, warn: 70, crit: 60}
    season: {target: 70, warn: 60, crit: 50}
  synthetic: true

sla_topics_share:
  title: SLA по темам
  definition: Доля обращений, закрытых в срок, установленный для их темы
  formula: closed_within_topic_sla / closed
