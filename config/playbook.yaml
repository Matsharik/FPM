# Шаблоны действий «причина → действие» для подсказки GET /api/deviations/{id}/suggest.
#
# Правило подходит, если совпадают все заданные условия when:
#   metric    — метрика KPI первопричины ("*" — любая);
#   node_type — тип узла первопричины;
#   tags      — теги узла первопричины (все перечисленные).
# Чем больше условий совпало, тем выше правило в списке. Отдаются 1–3 шаблона.
# Тексты — общие управленческие шаги, без фактов о компании.

rules:
  - id: PB-DEFECT-BATCH
    when: {metric: defect_rate, tags: {function: production}}
    title: Проверить партию материала и усилить выходной контроль
    action: >-
      Проверить партию материала, запущенную перед ростом брака; на время проверки
      усилить выборочный контроль ОТК на участке
    owner_hint: Зам. по производству
    due_days: 3
    recheck_window_days: 7

  - id: PB-DEFECT-LOAD
    when: {metric: defect_rate}
    title: Снизить нагрузку смены на участке
    action: >-
      Перераспределить заказы между сменами, чтобы нагрузка вернулась к норме;
      проверить укомплектованность смены
    owner_hint: Зам. по производству
    due_days: 2
    recheck_window_days: 7

  - id: PB-DEFECT-ESCAPE
    when: {metric: defect_escape_rate}
    title: Разобрать случаи пропуска брака с контролёрами ОТК
    action: Разобрать случаи пропуска брака, обновить чек-лист выходного контроля
    owner_hint: Зам. по производству
    due_days: 3
    recheck_window_days: 7

  - id: PB-SHIFT-LOAD
    when: {metric: shift_load}
    title: Выровнять загрузку смен
    action: Перенести часть заказов на другие смены или добавить людей в смену
    owner_hint: HR
    due_days: 2
    recheck_window_days: 7

  - id: PB-SUPPORT-SLA
    when: {metric: sla_topics_share}
    title: Перераспределить обращения между темами
    action: Перераспределить менеджеров поддержки на темы с просроченным SLA
    owner_hint: Зам. по работе с клиентами
    due_days: 1
    recheck_window_days: 7

  - id: PB-GENERIC
    when: {metric: "*"}
    title: Разобрать причину с владельцем узла
    action: >-
      Назначить ответственного, разобрать причину отклонения с владельцем узла
      первопричины и договориться о мере с проверяемым результатом
    owner_hint: null
    due_days: 3
    recheck_window_days: 7
